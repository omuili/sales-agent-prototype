[project]
name = "cap-931"
version = "0.1.0"
description = "Multi-agent sales account research assistant (Per Scholas CAP 931 capstone)"
readme = "README.md"
authors = [
    { name = "omuili", email = "olanrewaju.muili@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "streamlit>=1.66.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
cap-931 = "cap_931:main"
cap-931-alerts = "cap_931:alerts_main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
